    # ---------------------------------------------------------------------
    # statusngin_hostchecks
    # ---------------------------------------------------------------------
    HostCheckEvent:
      type: object
      title: HostCheckEvent (statusngin_hostchecks)
      description: |
        One completed host check result. Also written to
        `statusengine_hostchecks` (append-only history, primary key
        `hostname` + `start_time` + `timestamp_usec`).
      properties:
        timestamp_usec: { type: integer, description: Microseconds alongside start_time; part of this row's primary key. }
        host_name: { type: string }
        command_line: { type: string }
        command_name: { type: string }
        output: { type: string }
        long_output: { type: string }
        perf_data: { type: string }
        check_type: { type: integer, description: "0=active, 1=passive." }
        current_attempt: { type: integer }
        max_attempts: { type: integer }
        state_type: { type: integer, description: "0=SOFT, 1=HARD." }
        state: { type: integer, description: "0=UP, 1=DOWN, 2=UNREACHABLE." }
        timeout: { type: integer }
        start_time: { type: integer, format: int64 }
        end_time: { type: integer, format: int64 }
        early_timeout: { type: integer, description: "0 or 1." }
        execution_time: { type: number }
        latency: { type: number }
        return_code: { type: integer }
      example:
        check_type: 0
        command_line: "$USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5"
        command_name: check-host-alive
        current_attempt: 1
        early_timeout: 0
        end_time: 1785470668
        execution_time: 4.097793
        host_name: localhost
        latency: 0.6037200093269348
        long_output: ""
        max_attempts: 10
        output: "PING OK - Packet loss = 0%, RTA = 0.08 ms"
        perf_data: "rta=0.078000ms;3000.000000;5000.000000;0.000000 pl=0%;80;100;0"
        return_code: 0
        start_time: 1785470664
        state: 0
        state_type: 1
        timeout: 30
        timestamp_usec: 701779

    # ---------------------------------------------------------------------
    # statusngin_servicechecks
    # ---------------------------------------------------------------------
    ServiceCheckEvent:
      type: object
      title: ServiceCheckEvent (statusngin_servicechecks)
      description: |
        One completed service check result. Also written to
        `statusengine_servicechecks` (append-only history). This is the
        same underlying shape as `ServicePerfdataEvent` below - see that
        schema's description for why `statusngin_service_perfdata` only
        ever fills in a few of these fields.
      properties:
        timestamp_usec: { type: integer, description: Microseconds alongside start_time; part of this row's primary key. }
        host_name: { type: string }
        service_description: { type: string }
        command_line: { type: string }
        command_name: { type: string }
        output: { type: string }
        long_output: { type: string }
        perf_data: { type: string }
        check_type: { type: integer, description: "0=active, 1=passive." }
        current_attempt: { type: integer }
        max_attempts: { type: integer }
        state_type: { type: integer, description: "0=SOFT, 1=HARD." }
        state: { type: integer, description: "0=OK, 1=WARNING, 2=CRITICAL, 3=UNKNOWN." }
        timeout: { type: integer }
        start_time: { type: integer, format: int64 }
        end_time: { type: integer, format: int64 }
        early_timeout: { type: integer, description: "0 or 1." }
        execution_time: { type: number }
        latency: { type: number }
        return_code: { type: integer }
      example:
        command_line: "$USER1$/check_users -w $ARG1$ -c $ARG2$"
        command_name: "check_local_users!20!50"
        current_attempt: 1
        end_time: 1785470660
        execution_time: 0.002062
        host_name: localhost
        latency: 0.6007760167121887
        max_attempts: 4
        output: "USERS OK - 0 users currently logged in"
        perf_data: "users=0;20;50;0"
        service_description: Current Users
        start_time: 1785470660
        state_type: 1
        timeout: 60
        timestamp_usec: 603182

    # ---------------------------------------------------------------------
    # statusngin_service_perfdata
    # ---------------------------------------------------------------------
    ServicePerfdataEvent:
      type: object
      title: ServicePerfdataEvent (statusngin_service_perfdata)
      description: |
        Carries the same object shape as `ServiceCheckEvent` (the worker
        decodes both queues with the same Go type), but in practice Naemon
        only ever populates `host_name`, `service_description`, `perf_data`
        and `start_time` on this queue - every other field is simply
        absent, not zero. `perf_data` is the raw, unparsed Nagios/Naemon
        perfdata string (`label=value[unit];warn;crit;min;max`, repeated,
        space-separated); the worker itself parses it into individual
        metrics for MySQL/Graphite, but the WebSocket
        broadcast always carries the original raw string, not the parsed
        metrics.
      properties:
        host_name: { type: string }
        service_description: { type: string }
        perf_data: { type: string }
        start_time: { type: integer, format: int64 }
      example:
        host_name: localhost
        perf_data: "users=0;20;50;0"
        service_description: Current Users
        start_time: 1785470660

    # ---------------------------------------------------------------------
    # statusngin_statechanges
    # ---------------------------------------------------------------------
    StateChangeEvent:
      type: object
      title: StateChangeEvent (statusngin_statechanges)
      description: |
        A host or service state history entry - not necessarily a state
        *transition* despite the name (Naemon/Nagios historically reuses
        this event for both a genuine change and periodic re-logging of an
        unchanged state; use `state`/`last_state` to tell them apart if it
        matters to your client). Host and service entries share this one
        topic; `statechange_type` tells them apart. Also written to
        `statusengine_host_statehistory` / `statusengine_service_statehistory`.
      properties:
        timestamp: { type: integer, format: int64 }
        timestamp_usec: { type: integer }
        host_name: { type: string }
        service_description:
          type: string
          description: Empty for a host state change (see statechange_type).
        output: { type: string }
        long_output: { type: string }
        statechange_type:
          type: integer
          description: "0 = host state change, 1 = service state change."
        state:
          type: integer
          description: Current state; coding depends on statechange_type (host or service - see HostStatusEvent/ServiceStatusEvent's current_state).
        state_type: { type: integer, description: "0=SOFT, 1=HARD." }
        current_attempt: { type: integer }
        max_attempts: { type: integer }
        last_state: { type: integer }
        last_hard_state: { type: integer }
      example:
        current_attempt: 4
        host_name: localhost
        last_hard_state: 1
        last_state: 1
        long_output: "Your random value is: 158"
        max_attempts: 4
        output: "Your random value is: 158"
        service_description: Flapping
        state: 0
        state_type: 1
        statechange_type: 1
        timestamp: 1785470683
        timestamp_usec: 632628

    # ---------------------------------------------------------------------
    # statusngin_logentries
    # ---------------------------------------------------------------------
    LogEntryEvent:
      type: object
      title: LogEntryEvent (statusngin_logentries)
      description: |
        One raw Naemon/Nagios log line, as it would appear in the core's
        own log file. Also written to `statusengine_logentries`.
      properties:
        entry_time: { type: integer, format: int64 }
        data_type:
          type: integer
          description: Naemon/Nagios log entry type code (NEBTYPE_LOG*); meaning depends on the specific core in use.
        data: { type: string, description: The log line's text. }
      example:
        data: "Event broker module '/opt/statusengine/lib/libstatusengine.so' initialized successfully."
        data_type: 262144
        entry_time: 1785470659

    # ---------------------------------------------------------------------
    # statusngin_notifications
    # ---------------------------------------------------------------------
    NotificationEvent:
      type: object
      title: NotificationEvent (statusngin_notifications)
      description: |
        A completed notification (the "parent" notification - see
        `ContactNotificationMethodEvent` for the per-contact deliveries it
        triggered). Only published once the notification has fully
        finished; `type` is always `601` (`NEBTYPE_NOTIFICATION_END`) on
        this topic - in-progress notifications aren't broadcast. Also
        written to `statusengine_host_notifications_log` /
        `statusengine_service_notifications_log`.
      properties:
        type: { type: integer, description: "Always 601 (NEBTYPE_NOTIFICATION_END) on this topic." }
        timestamp_usec: { type: integer }
        host_name: { type: string }
        service_description:
          type: string
          description: Empty for a host notification.
        output: { type: string }
        long_output: { type: string }
        ack_author:
          type: string
          description: Set if this notification was triggered by an acknowledgement.
        ack_data: { type: string }
        notification_type: { type: integer, description: Naemon/Nagios notification type code. }
        start_time: { type: integer, format: int64 }
        end_time: { type: integer, format: int64 }
        reason_type: { type: integer, description: Naemon/Nagios notification reason code. }
        state: { type: integer, description: State being notified about; coding depends on host vs. service. }
        escalated: { type: integer, description: "0 or 1." }
        contacts_notified: { type: integer, description: How many contacts were actually notified. }
      example:
        ack_author: Daniel Z
        ack_data: Test notification
        contacts_notified: 1
        end_time: 1785517089
        escalated: 0
        host_name: localhost
        long_output: "CRITICAL: Agent error: Error response from daemon: client version 1.51 is too new. Maximum supported API version is 1.46"
        notification_type: 1
        output: "CRITICAL: Agent error: Error response from daemon: client version 1.51 is too new. Maximum supported API version is 1.46"
        reason_type: 8
        service_description: Swap Usage
        start_time: 1785517089
        state: 2
        timestamp_usec: 927750
        type: 601

    # ---------------------------------------------------------------------
    # statusngin_contactnotificationmethod
    # ---------------------------------------------------------------------
    ContactNotificationMethodEvent:
      type: object
      title: ContactNotificationMethodEvent (statusngin_contactnotificationmethod)
      description: |
        One contact's actual notification delivery - the per-contact detail
        behind a `NotificationEvent`. Only published once that delivery has
        completed; `type` is always `605`
        (`NEBTYPE_CONTACTNOTIFICATIONMETHOD_END`) on this topic. Also
        written to `statusengine_host_notifications` /
        `statusengine_service_notifications`.
      properties:
        type: { type: integer, description: "Always 605 (NEBTYPE_CONTACTNOTIFICATIONMETHOD_END) on this topic." }
        timestamp: { type: integer, format: int64 }
        timestamp_usec: { type: integer }
        host_name: { type: string }
        service_description:
          type: string
          description: Empty for a host notification.
        output: { type: string }
        ack_author: { type: string }
        ack_data: { type: string }
        contact_name: { type: string, description: Which contact this delivery was for. }
        command_name: { type: string, description: Notification command used to reach this contact. }
        command_args:
          type: [string, "null"]
        reason_type: { type: integer, description: Naemon/Nagios notification reason code. }
        state: { type: integer }
        start_time: { type: integer, format: int64 }
        end_time: { type: integer, format: int64 }
      example:
        ack_author: Daniel Z
        ack_data: Test notification
        command_args: null
        command_name: 52c9c3e2-4a00-40a4-8e75-db4649eba846
        contact_name: 286a2700-006a-4d7d-a6fe-6df5b3533ad2
        end_time: 1785517089
        host_name: localhost
        output: "CRITICAL: Agent error: Error response from daemon: client version 1.51 is too new. Maximum supported API version is 1.46"
        reason_type: 8
        service_description: Swap Usage
        start_time: 1785517089
        state: 2
        timestamp: 1785517089
        timestamp_usec: 927284
        type: 605

    # ---------------------------------------------------------------------
    # statusngin_acknowledgements
    # ---------------------------------------------------------------------
    AcknowledgementEvent:
      type: object
      title: AcknowledgementEvent (statusngin_acknowledgements)
      description: |
        A host or service problem being acknowledged. Also written to
        `statusengine_host_acknowledgements` /
        `statusengine_service_acknowledgements`.
      properties:
        entry_time: { type: integer, format: int64 }
        entry_time_usec: { type: integer, description: Part of this row's primary key alongside entry_time. }
        host_name: { type: string }
        service_description:
          type: string
          description: Empty for a host acknowledgement.
        state: { type: integer, description: The state being acknowledged. }
        author_name: { type: string }
        comment_data: { type: string }
        acknowledgement_type: { type: integer, description: "1=normal, 2=sticky (per the Nagios plugin API)." }
        is_sticky: { type: integer, description: "0 or 1." }
        persistent_comment: { type: integer, description: "0 or 1." }
        notify_contacts: { type: integer, description: "0 or 1 - whether contacts were notified about the acknowledgement itself." }
      example:
        acknowledgement_type: 1
        author_name: Daniel Z
        comment_data: I will take a look at this
        entry_time: 1785516972
        entry_time_usec: 732213
        host_name: localhost
        is_sticky: 0
        notify_contacts: 1
        persistent_comment: 1
        service_description: Swap Usage
        state: 2

    # ---------------------------------------------------------------------
    # statusngin_downtimes
    # ---------------------------------------------------------------------
    DowntimeEvent:
      type: object
      title: DowntimeEvent (statusngin_downtimes)
      description: |
        Covers a scheduled downtime's entire lifecycle: this topic
        broadcasts every stage - ADD, START, STOP and DELETE (and LOAD, on
        a core restart when a still-pending downtime is restored from
        retention.dat) - for the same `downtime.downtime_id`, so a client
        must look at `type` (and, for STOP, `attr`) to know what actually
        happened, not just react to "a downtime message arrived":

        | `type` | Meaning |
        |---|---|
        | `1100` | `ADD` - a new downtime was scheduled. |
        | `1101` | `DELETE` - the downtime was removed (whether it had started or not). |
        | `1102` | `LOAD` - a still-pending downtime was restored from retention.dat after a core restart. |
        | `1103` | `START` - the downtime became active. |
        | `1104` | `STOP` - the downtime ended; see `attr` for **how**. |

        **`attr` only matters when `type` is `1104` (STOP)** - it's the
        field that tells a normally-expired downtime apart from one a user
        cancelled early:

        | `attr` (only when type=1104) | Meaning |
        |---|---|
        | `1` | `NORMAL` - the downtime ran to its scheduled `end_time`. |
        | `2` | `CANCELLED` - a user stopped it early. |

        A *deleted* downtime is signalled by `type=1101` (`DELETE`), not by
        `attr` - `attr` is only meaningful on a STOP event. Also written to
        `statusengine_host_scheduleddowntimes` /
        `statusengine_service_scheduleddowntimes` (the currently
        pending/active downtime) and
        `statusengine_host_downtimehistory` /
        `statusengine_service_downtimehistory` (permanent history) - see
        `.claude/specs/downtime_ablauf.txt` in the repository for the full
        per-type processing matrix.
      properties:
        type:
          type: integer
          description: "1100=ADD, 1101=DELETE, 1102=LOAD, 1103=START, 1104=STOP - see the table above."
        flags: { type: integer }
        attr:
          type: integer
          description: "Only meaningful when type=1104 (STOP): 1=NORMAL (ran to completion), 2=CANCELLED (stopped early). 0 otherwise."
        timestamp: { type: integer, format: int64 }
        timestamp_usec: { type: integer }
        downtime:
          type: object
          properties:
            host_name: { type: string }
            service_description:
              type: string
              description: Empty for a host downtime (see downtime_type).
            author_name: { type: string }
            comment_data: { type: string }
            downtime_type:
              type: integer
              description: "1=service, 2=host - note this is the INVERSE of the 0=host/1=service convention used elsewhere (e.g. statechange_type, acknowledgement host/service split)."
            entry_time: { type: integer, format: int64, description: When the downtime was scheduled. }
            start_time: { type: integer, format: int64 }
            end_time: { type: integer, format: int64 }
            triggered_by:
              type: integer
              description: downtime_id of the downtime that triggered this one, or 0 if none.
            downtime_id: { type: integer }
            fixed: { type: integer, description: "0 or 1 - fixed (exact start/end) vs. flexible downtime." }
            duration: { type: integer, description: Seconds; only meaningful for a flexible (fixed=0) downtime. }
      example:
        attr: 0
        downtime:
          author_name: Daniel Z
          comment_data: In maintenance
          downtime_id: 1
          downtime_type: 1
          duration: 120
          end_time: 1785517500
          entry_time: 1785517314
          fixed: 1
          host_name: efb91fa3-2bd4-47a4-a89b-1ffe9ca719b5
          service_description: 66d42eec-650f-4a98-aeaf-8ee51beaac62
          start_time: 1785517380
          triggered_by: 0
        flags: 0
        timestamp: 1785517315
        timestamp_usec: 224439
        type: 1100

    # ---------------------------------------------------------------------
    # statusngin_core_restart
    # ---------------------------------------------------------------------
    CoreRestartEvent:
      type: object
      title: CoreRestartEvent (statusngin_core_restart)
      description: |
        Fires once when the monitoring core restarts or reloads its
        configuration. `object_type` is always `102` - other values are
        silently ignored by the worker and never reach this topic. On
        receiving this, the worker also clears out stale
        `statusengine_hoststatus`/`statusengine_servicestatus` rows (or, if
        `enable_openitcockpit_tweaks` is set, only rows for objects
        openITCockpit no longer knows about) so every host/service is
        rebuilt from the fresh post-restart check results.
      properties:
        object_type: { type: integer, description: "Always 102." }
        timestamp:
          type: integer
          format: int64
          description: |
            Unix seconds the restart happened at, if the core sends it -
            currently always 0, since no supported core populates this
            field yet. When 0, the worker uses its own wall-clock time
            instead as the cutoff for clearing stale status rows.
      example:
        object_type: 102
        timestamp: 0

paths:
  /ws:
    get:
      operationId: connectWebSocket
      summary: Open the event WebSocket connection
      description: |
        Upgrades to a WebSocket connection and starts streaming events (see
        this document's top-level description for the full protocol,
        authentication and topic list). This entry describes the HTTP
        handshake; once upgraded, the connection follows the WebSocket
        protocol described above, not further HTTP request/responses.
      servers:
        - url: http://127.0.0.1:8080
          description: Use ws:// once upgraded (wss:// behind TLS).
      # No `- {}` alternative: /ws is never served unauthenticated, so an
      # anonymous request is not a valid way to call this operation.
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      parameters:
        - $ref: "#/components/parameters/topics"
        - $ref: "#/components/parameters/apiKeyQueryParam"
      responses:
        "101":
          description: |
            Switching Protocols - the connection is now a WebSocket. See
            this document's top-level description for the message protocol
            that follows.
        "401":
          description: |
            Missing or invalid API key. Authentication cannot be turned off -
            if no key is configured, the worker generates one at startup and
            logs it, so this is also what an otherwise correct client gets
            after a restart changed that generated key.
          content:
            text/plain:
              schema:
                type: string
              example: unauthorized

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Standard Prometheus text-format exposition of every metric the
        pipeline records. Unauthenticated by design - see this document's
        top-level description. Metrics (all under the `statusengine_`
        namespace):

        | Metric | Type | Labels | Meaning |
        |---|---|---|---|
        | `statusengine_queue_messages_received_total` | counter | `queue_name` | Raw messages received per queue, regardless of backend (Gearman/RabbitMQ). |
        | `statusengine_queue_payloads_repaired_total` | counter | `queue_name` | Payloads that were not valid UTF-8 and had their invalid bytes reinterpreted as Windows-1252 before decoding. Non-zero means a monitoring host is emitting non-UTF-8 plugin output. |
        | `statusengine_queue_events_discarded_stale_total` | counter | `queue_name` | Status events dropped for being older than `status_max_age` (default 5m), before reaching MySQL or any WebSocket client. Only `statusngin_hoststatus` and `statusngin_servicestatus` ever appear here - they carry superseded snapshots, every other queue carries history. A burst after a restart is the feature working; a value that keeps climbing while the worker is up means the monitoring core's clock and this worker's disagree, and both queues are being discarded wholesale. |
        | `statusengine_queue_jobs_in_flight` | gauge | - | Messages currently being handled, across all queues. |
        | `statusengine_queue_handler_duration_seconds` | histogram | `queue_name` | Time to handle one message end to end: decode, WebSocket publish and enqueueing every decoded item for insertion. |
        | `statusengine_db_events_written_total` | counter | `table` | Rows successfully persisted per destination table. |
        | `statusengine_db_batch_flush_duration_seconds` | histogram | - | Duration of each bulk-insert flush to MySQL. |
        | `statusengine_db_batch_size_at_flush` | histogram | - | Row count of each bulk-insert flush - shows whether flushes are mostly hitting the 100-row batch size or the 250ms ticker. |
        | `statusengine_db_batch_retries_total` | counter | - | Bulk inserts re-executed unchanged after MySQL reported a deadlock (1213) or a lock wait timeout (1205). Both are transient and cost only the retry, but they mean another writer is contending for the same rows - in practice `db_cleanup` running against a busy table. Occasional increments are harmless; a steadily rising value is a scheduling problem, not a database one. |
        | `statusengine_db_available` | gauge | - | 1 while bulk inserts are reaching MySQL, 0 from the first connection failure until one succeeds again. **This is the one to alert on.** While it is 0 no data is being lost - the batch is held and the backlog waits at the broker - but nothing is draining either, so the catch-up afterwards takes as long as the outage did. |
        | `statusengine_db_connection_retries_total` | counter | - | Flush attempts repeated because MySQL was unreachable. Unbounded by design, so this counts the *length* of an outage rather than the number of incidents - a 30-second MySQL restart adds roughly a dozen. |
        | `statusengine_websocket_clients_active` | gauge | - | Currently connected WebSocket clients. |
        | `statusengine_websocket_messages_broadcasted_total` | counter | - | Messages successfully handed to a client's send buffer. |
        | `statusengine_websocket_messages_dropped_total` | counter | - | Messages dropped because a client's send buffer was full - non-blocking broadcast. Deliberately unlabeled: a client id is unique per connection, so labeling by it would mint a permanent new time series on every reconnect. Which client was too slow is logged when that client disconnects. |
        | `statusengine_websocket_publish_dropped_total` | counter | - | Events dropped because the Hub's *inbound* buffer was full, i.e. the broadcast goroutine could not keep up. Distinct from `messages_dropped_total` above and far more serious: that one means a single slow client missed a message, this one means the event reached no client at all. A non-zero rate here is what to alert on. |
        | `statusengine_pipeline_errors_total` | counter | `component` (`mysql`, `websocket`, `graphite`, `queue`) | Errors encountered anywhere in the pipeline. |

        Plus the standard Go runtime/process metrics `promhttp.Handler()`
        exposes automatically (`go_*`, `process_*`).

        ### Every series exists from the first scrape

        All label combinations are pre-created at zero during startup, so
        a freshly started worker already exports all 12 `queue_name`
        series, all 18 `table` series and all 4 `component` series rather
        than growing them as traffic arrives. Prometheus normally creates
        a labeled series only on its first observation, which would mean
        `statusengine_pipeline_errors_total{component="mysql"}` does not
        exist until MySQL has actually failed - so a panel would read
        "No data" precisely while everything is healthy, and an alert on
        it would never evaluate. Dashboards can therefore rely on every
        series below being present and can treat a missing one as the
        worker being down rather than merely idle.

        ### Is the worker keeping up?

        Three of these answer that together. `queue_jobs_in_flight` sitting
        at the consumer's concurrency cap (`-gearman-max-concurrent-jobs`,
        default 64, or `-rabbitmq-prefetch` per queue) means the broker is
        feeding faster than the pipeline drains - which is working as
        intended, since the surplus then waits at the broker rather than
        accumulating in this process. `queue_handler_duration_seconds`
        shows where that time goes: a handler blocks in the bulk-insert
        buffer once it is full, so this is where MySQL backpressure becomes
        visible from the ingestion side. `db_batch_size_at_flush` pinned at
        100 means flushes are triggered by the batch size rather than the
        250ms ticker - the same saturation seen from the database side.
        `go_goroutines` staying flat under a backlog confirms the cap is
        holding.
      servers:
        - url: http://localhost:9105
      security: []
      responses:
        "200":
          description: OK
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
              example: |
                # HELP statusengine_queue_messages_received_total Total number of messages received per queue.
                # TYPE statusengine_queue_messages_received_total counter
                statusengine_queue_messages_received_total{queue_name="statusngin_hoststatus"} 1042
                # HELP statusengine_queue_jobs_in_flight Number of queue messages currently being handled.
                # TYPE statusengine_queue_jobs_in_flight gauge
                statusengine_queue_jobs_in_flight 0
                # HELP statusengine_queue_handler_duration_seconds Duration of handling one message, per queue.
                # TYPE statusengine_queue_handler_duration_seconds histogram
                statusengine_queue_handler_duration_seconds_bucket{queue_name="statusngin_hoststatus",le="0.01"} 2
                statusengine_queue_handler_duration_seconds_bucket{queue_name="statusngin_hoststatus",le="0.025"} 3
                statusengine_queue_handler_duration_seconds_bucket{queue_name="statusngin_hoststatus",le="+Inf"} 3
                statusengine_queue_handler_duration_seconds_sum{queue_name="statusngin_hoststatus"} 0.03264118
                statusengine_queue_handler_duration_seconds_count{queue_name="statusngin_hoststatus"} 3
                # HELP statusengine_db_events_written_total Total number of events successfully written per table.
                # TYPE statusengine_db_events_written_total counter
                statusengine_db_events_written_total{table="statusengine_hoststatus"} 1042
                # HELP statusengine_db_batch_flush_duration_seconds Duration of bulk-insert flushes to MySQL.
                # TYPE statusengine_db_batch_flush_duration_seconds histogram
                statusengine_db_batch_flush_duration_seconds_bucket{le="0.005"} 8
                statusengine_db_batch_flush_duration_seconds_bucket{le="0.01"} 15
                statusengine_db_batch_flush_duration_seconds_bucket{le="+Inf"} 15
                statusengine_db_batch_flush_duration_seconds_sum 0.081
                statusengine_db_batch_flush_duration_seconds_count 15
                # HELP statusengine_websocket_clients_active Number of currently connected WebSocket clients.
                # TYPE statusengine_websocket_clients_active gauge
                statusengine_websocket_clients_active 3
                # HELP statusengine_websocket_messages_dropped_total Total number of messages dropped for slow WebSocket clients.
                # TYPE statusengine_websocket_messages_dropped_total counter
                statusengine_websocket_messages_dropped_total 0
                # HELP statusengine_websocket_publish_dropped_total Total number of events dropped because the Hub's inbound broadcast buffer was full.
                # TYPE statusengine_websocket_publish_dropped_total counter
                statusengine_websocket_publish_dropped_total 0
                # HELP statusengine_pipeline_errors_total Total number of errors encountered per pipeline component.
                # TYPE statusengine_pipeline_errors_total counter
                statusengine_pipeline_errors_total{component="mysql"} 0
