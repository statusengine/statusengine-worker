openapi: 3.1.0
info:
  title: Statusengine Worker API
  version: "1.0.0"
  description: |
    Live event stream and operational metrics exposed by the Statusengine Go
    worker. The worker runs two independent HTTP servers:

    | Server | Default address | Endpoint |
    |---|---|---|
    | WebSocket | `-listen-addr` (`STATUSENGINE_LISTEN_ADDR`), default `127.0.0.1:8080` | `GET /ws` |
    | Metrics | `-metrics-listen-addr` (`STATUSENGINE_METRICS_LISTEN_ADDR`), default `:9105` | `GET /metrics` |

    The WebSocket server binds to loopback by default: the `/ws` stream
    carries every monitoring event the worker sees, so exposing it on the
    network is a deliberate `-listen-addr` decision rather than something
    that happens by leaving a setting alone.

    `/metrics` has no authentication of its own - it's meant to be reached
    only by a trusted Prometheus scraper, typically by keeping that port off
    any public network rather than by an application-level check.

    ## Authentication (`/ws` only)

    **Always on.** `/ws` is never served unauthenticated. Configure the
    accepted keys with `-api-keys` (`STATUSENGINE_API_KEYS`,
    comma-separated) or the `api_keys` list in a YAML config file (see
    `config.example.yaml`).

    Leaving that empty does **not** disable authentication: the worker
    generates a random key at startup instead and logs it as a warning
    (`websocket: no API key configured, generated a random one for this
    run`). That is a safety net so an unconfigured worker is never an open
    event stream - it changes on every restart, so configure a real key for
    any client that has to reconnect on its own.

    Every `/ws` request must present a valid key, using **one** of these
    three methods:

    | Method | Use for | Example |
    |---|---|---|
    | `Authorization: Bearer <key>` header | **Any real client.** | `Authorization: Bearer s3cr3t` |
    | `X-Api-Key: <key>` header | **Any real client**, equally valid. | `X-Api-Key: s3cr3t` |
    | `?api_key=<key>` query parameter | **Browser demo client only** (`web/ws-test-client.html`). | `wss://host/ws?api_key=s3cr3t` |

    **A header is always preferred over the query parameter, and real
    clients should always use one.** The query parameter exists purely as a
    fallback for the browser-based demo client, since browser JavaScript's
    `WebSocket` constructor cannot set custom headers on the handshake
    request. Unlike a header, a value in the URL can leak into access logs,
    reverse-proxy logs and browser history - avoid it for anything other
    than quick manual testing in a browser.

    A request without a valid key is rejected with `401 Unauthorized`
    before the WebSocket handshake ever upgrades - no connection is
    established.

    The handshake's `Origin` header is deliberately **not** checked. That
    check defends against a web page opening this endpoint behind an
    operator's back, which only pays off against an endpoint that
    authenticates ambiently (cookies) or not at all - neither applies here,
    since the key travels explicitly and the listener is loopback-only
    unless someone opts out.

    ## The `/ws` protocol

    After a successful handshake, the connection carries two independent
    message flows:

    - **Server → client:** every event the worker's pipeline processes,
      wrapped in a small envelope: `{"topic": "<queue name>", "payload":
      { ... }}`. `topic` is always one of the 12 queue names below;
      `payload`'s shape depends on which one - see the *Schemas* section
      and each topic's description below for a real example.
    - **Client → server:** at any time, a client may send a control frame
      to change which topics it receives:
      `{"subscribe": ["statusngin_hoststatus"]}` and/or
      `{"unsubscribe": ["statusngin_hoststatus"]}` (either or both keys, any
      number of topic names). The initial subscription can also be set at
      connect time via the `topics` query parameter (comma-separated). A
      client that never specifies any topics - neither via `?topics=` nor
      a `subscribe` frame - receives **every** topic.

    ## Event topics

    Each topic below is also the exact Gearman/RabbitMQ queue name the
    worker itself consumes from. Click through to each
    schema for a real captured example.

    | Topic | Payload schema | Notes |
    |---|---|---|
    | `statusngin_hoststatus` | [`HostStatusEvent`](#/components/schemas/HostStatusEvent) | One message per host status update. |
    | `statusngin_servicestatus` | [`ServiceStatusEvent`](#/components/schemas/ServiceStatusEvent) | One message per service status update. |
    | `statusngin_hostchecks` | [`HostCheckEvent`](#/components/schemas/HostCheckEvent) | One message per completed host check. |
    | `statusngin_servicechecks` | [`ServiceCheckEvent`](#/components/schemas/ServiceCheckEvent) | One message per completed service check. |
    | `statusngin_service_perfdata` | [`ServicePerfdataEvent`](#/components/schemas/ServicePerfdataEvent) | Same wire shape as `ServiceCheckEvent`, but only `host_name`, `service_description`, `perf_data` and `start_time` are ever populated - see the schema description. |
    | `statusngin_statechanges` | [`StateChangeEvent`](#/components/schemas/StateChangeEvent) | Host **and** service state changes share this topic; distinguish them via `statechange_type` (`0` = host, `1` = service). |
    | `statusngin_logentries` | [`LogEntryEvent`](#/components/schemas/LogEntryEvent) | Raw Naemon/Nagios log lines. |
    | `statusngin_notifications` | [`NotificationEvent`](#/components/schemas/NotificationEvent) | Only published once a notification has fully completed (`type` `601`, `NEBTYPE_NOTIFICATION_END`) - in-progress notifications aren't broadcast. |
    | `statusngin_contactnotificationmethod` | [`ContactNotificationMethodEvent`](#/components/schemas/ContactNotificationMethodEvent) | One message per contact actually notified; only published once that delivery has completed (`type` `605`, `NEBTYPE_CONTACTNOTIFICATIONMETHOD_END`). |
    | `statusngin_acknowledgements` | [`AcknowledgementEvent`](#/components/schemas/AcknowledgementEvent) | One message per acknowledgement set on a host or service. |
    | `statusngin_downtimes` | [`DowntimeEvent`](#/components/schemas/DowntimeEvent) | Covers a downtime's **entire** lifecycle (add/start/stop/delete) on one topic - see the schema description for how to tell those apart, including the `attr` field for a cancelled vs. naturally-expired downtime. |
    | `statusngin_core_restart` | [`CoreRestartEvent`](#/components/schemas/CoreRestartEvent) | Fires once when the monitoring core (Naemon/Nagios/Icinga) restarts or reloads its configuration. |
  contact:
    name: Statusengine
    url: https://github.com/statusengine/worker

servers:
  - url: http://localhost:9105
    description: Prometheus metrics (default -metrics-listen-addr)
  - url: http://127.0.0.1:8080
    description: WebSocket handshake (default -listen-addr, loopback-only; use ws:// once upgraded)

# The API's default is authenticated; /metrics opts out explicitly with
# `security: []`, which is the one unauthenticated endpoint.
security:
  - BearerAuth: []
  - ApiKeyHeader: []
  - ApiKeyQuery: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        **Recommended.** `Authorization: Bearer <key>`. Use this for any
        client that isn't a browser tab.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        **Recommended**, equally to `BearerAuth` - pick whichever your HTTP
        client makes easier. `X-Api-Key: <key>`.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: |
        **Not recommended for real clients.** Exists only because browser
        JavaScript's `WebSocket` API can't set custom headers during the
        handshake (used by the bundled `web/ws-test-client.html` demo
        client). Prefer `BearerAuth` or `ApiKeyHeader` whenever the client
        isn't a browser - a query parameter can leak into logs and history
        in ways a header does not.

  parameters:
    topics:
      name: topics
      in: query
      required: false
      description: |
        Comma-separated list of topics to subscribe to on connect (e.g.
        `statusngin_hoststatus,statusngin_servicestatus`). Omit or leave
        empty to receive every topic. Can be changed later at any time via
        a `{"subscribe": [...]}` / `{"unsubscribe": [...]}` control frame.
      schema:
        type: string
        example: statusngin_hoststatus,statusngin_servicestatus
    apiKeyQueryParam:
      name: api_key
      in: query
      required: false
      description: |
        See the `ApiKeyQuery` security scheme above - browser-client
        fallback only, prefer a header for real clients.
      schema:
        type: string

  schemas:
    # ---------------------------------------------------------------------
    # Protocol envelope / control messages
    # ---------------------------------------------------------------------
    OutboundMessage:
      type: object
      description: |
        The wire format for every server → client message. `payload`'s
        shape depends on `topic` - see the topic table in this document's
        top-level description, or browse the per-topic schemas below.
      required: [topic, payload]
      properties:
        topic:
          type: string
          description: The queue name this event came from.
          example: statusngin_hoststatus
        payload:
          type: object
          description: See the schema matching `topic` (e.g. `HostStatusEvent` for `statusngin_hoststatus`).

    SubscriptionMessage:
      type: object
      description: |
        A client → server control frame that (re)configures which topics
        this connection receives. Both keys are optional and can be
        combined in one frame; either can list any number of topic names.
      properties:
        subscribe:
          type: array
          items: { type: string }
          example: [statusngin_hoststatus]
        unsubscribe:
          type: array
          items: { type: string }
          example: [statusngin_servicestatus]

    Envelope:
      type: object
      description: |
        The common header Naemon/Nagios/Icinga's event broker module
        attaches to most queue messages. Individual topic schemas embed
        the subset of these fields they actually forward to WebSocket
        clients (field names/casing may differ slightly per topic - see
        each schema).
      properties:
        type:
          type: integer
          description: Broker event type. Meaning depends on the queue - see each topic's schema.
        flags: { type: integer }
        attr:
          type: integer
          description: Broker event attribute/sub-type. Only meaningful for a few event types - see e.g. DowntimeEvent.
        timestamp: { type: integer, format: int64, description: Unix seconds. }
        timestamp_usec: { type: integer, description: Microsecond component alongside timestamp. }

    # ---------------------------------------------------------------------
    # statusngin_hoststatus
    # ---------------------------------------------------------------------
    HostStatusEvent:
      type: object
      title: HostStatusEvent (statusngin_hoststatus)
      description: |
        A host's full current status, broadcast on every status update
        Naemon reports for it - not only on a state change. Also written to
        the `statusengine_hoststatus` table (one row per host, kept up to
        date via UPSERT).
      properties:
        timestamp: { type: integer, format: int64, description: Unix seconds this status was reported at. }
        name: { type: string, description: Hostname. }
        plugin_output: { type: string }
        long_plugin_output: { type: string }
        event_handler:
          type: [string, "null"]
          description: Configured event handler command, or null if none is set.
        perf_data: { type: string, description: "Raw Nagios/Naemon perfdata string, e.g. \"rta=0.077000ms;3000;5000;0 pl=0%;80;100;0\"." }
        check_command: { type: string }
        check_period: { type: string }
        current_state:
          type: integer
          description: "Host state: 0=UP, 1=DOWN, 2=UNREACHABLE."
        has_been_checked: { type: integer, description: "0 or 1." }
        should_be_scheduled: { type: integer, description: "0 or 1." }
        current_attempt: { type: integer }
        max_attempts: { type: integer }
        last_check: { type: integer, format: int64 }
        next_check: { type: integer, format: int64 }
        check_type: { type: integer, description: "0=active, 1=passive." }
        last_state_change: { type: integer, format: int64 }
        last_hard_state_change: { type: integer, format: int64 }
        last_hard_state: { type: integer, description: "Same coding as current_state." }
        last_time_up: { type: integer, format: int64 }
        last_time_down: { type: integer, format: int64 }
        last_time_unreachable: { type: integer, format: int64 }
        state_type: { type: integer, description: "0=SOFT, 1=HARD." }
        last_notification: { type: integer, format: int64 }
        next_notification: { type: integer, format: int64 }
        no_more_notifications: { type: integer, description: "0 or 1." }
        notifications_enabled: { type: integer, description: "0 or 1." }
        problem_has_been_acknowledged: { type: integer, description: "0 or 1." }
        acknowledgement_type: { type: integer }
        current_notification_number: { type: integer }
        accept_passive_checks: { type: integer, description: "0 or 1." }
        event_handler_enabled: { type: integer, description: "0 or 1." }
        checks_enabled: { type: integer, description: "0 or 1." }
        flap_detection_enabled: { type: integer, description: "0 or 1." }
        is_flapping: { type: integer, description: "0 or 1." }
        percent_state_change: { type: number }
        latency: { type: number }
        execution_time: { type: number }
        scheduled_downtime_depth: { type: integer, description: "Number of currently active overlapping downtimes; 0 means none." }
        process_performance_data: { type: integer, description: "0 or 1." }
        obsess: { type: integer, description: "0 or 1." }
        modified_attributes: { type: integer }
        check_interval: { type: number }
        retry_interval: { type: number }
      example:
        accept_passive_checks: 1
        acknowledgement_type: 0
        check_command: check-host-alive
        check_interval: 5
        check_period: 24x7
        check_type: 0
        checks_enabled: 1
        current_attempt: 1
        current_notification_number: 0
        current_state: 0
        event_handler: null
        event_handler_enabled: 1
        execution_time: 4.113
        flap_detection_enabled: 1
        has_been_checked: 1
        is_flapping: 0
        last_check: 1785470653
        last_hard_state: 0
        last_hard_state_change: 1711613888
        last_notification: 0
        last_state_change: 1762725251
        last_time_down: 1762725251
        last_time_unreachable: 0
        last_time_up: 1785470657
        latency: 0.259
        long_plugin_output: ""
        max_attempts: 10
        modified_attributes: 31
        name: demo.statusengine.org
        next_check: 1785470953
