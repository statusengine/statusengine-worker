    # ---------------------------------------------------------------------
    # statusngin_servicestatus
    # ---------------------------------------------------------------------
    ServiceStatusEvent:
      type: object
      title: ServiceStatusEvent (statusngin_servicestatus)
      description: |
        A service's full current status, broadcast on every status update -
        the ServiceStatusEvent equivalent of HostStatusEvent. Also written
        to `statusengine_servicestatus` (one row per host+service, UPSERT).
      properties:
        timestamp: { type: integer, format: int64 }
        host_name: { type: string }
        description: { type: string, description: Service description/name. }
        plugin_output: { type: string }
        long_plugin_output: { type: string }
        event_handler: { type: [string, "null"] }
        perf_data: { type: string }
        check_command: { type: string }
        check_period: { type: string }
        current_state:
          type: integer
